# ============================================================================
# First-party tracking proxy for Elysium
# ----------------------------------------------------------------------------
# Drop this INSIDE your existing `server { ... }` block (the one that already
# proxies to the Next.js app on 127.0.0.1:3000). It exposes the Meta pixel and
# GA4 gtag from YOUR OWN domain under non-obvious paths so ad blockers and
# tracking-prevention lists (which match on connect.facebook.net /
# googletagmanager.com / google-analytics.com) can't see or block them.
#
# Paths (must match TrackingConfig.proxy in the admin panel):
#   /e1/s.js          -> Meta pixel script   (connect.facebook.net/en_US/fbevents.js)
#   /e1/t             -> Meta event beacon    (www.facebook.com/tr)
#   /e1/...           -> Meta config fetches  (connect.facebook.net/...)
#   /e2/s.js          -> GA4 gtag.js          (www.googletagmanager.com/gtag/js)
#   /e2/g/collect     -> GA4 collect          (www.google-analytics.com/g/collect)
#
# Rename these to anything you like (then update them in /admin/tracking →
# Configuration → "First-party proxy paths"). Avoid the words facebook/meta/
# google/analytics/pixel/gtag/collect in the public path.
#
# NOTE on IP: a beacon proxied through Nginx reaches Meta/Google with YOUR
# server's IP, not the visitor's. That's fine — the unblockable server-side
# CAPI/MP path sends the real client_ip_address explicitly and dedups with the
# browser event via the shared event_id, so match quality is preserved.
# ============================================================================

# DNS resolver is required to proxy_pass to external hostnames at runtime.
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ---- Meta: pixel script (rewrite the hardcoded hostnames to first-party) ----
location = /e1/s.js {
    proxy_pass https://connect.facebook.net/en_US/fbevents.js;
    proxy_set_header Host connect.facebook.net;
    proxy_ssl_server_name on;

    # sub_filter needs uncompressed upstream; ask for identity then re-gzip.
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    # Send the events beacon and config fetches back through us (relative URLs
    # resolve against the current origin = your domain).
    sub_filter "https://www.facebook.com/tr" "/e1/t";
    sub_filter "https://connect.facebook.net" "/e1";

    proxy_hide_header Content-Security-Policy;
    add_header Cache-Control "public, max-age=3600";
    gzip on;
    gzip_types application/javascript;
}

# ---- Meta: the event beacon (GET + POST, keep the query string) ----
location = /e1/t {
    proxy_pass https://www.facebook.com/tr$is_args$args;
    proxy_set_header Host www.facebook.com;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# ---- Meta: config/signals fetches done by fbevents.js ----
location ^~ /e1/ {
    proxy_pass https://connect.facebook.net/;
    proxy_set_header Host connect.facebook.net;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
}

# ---- GA4: gtag.js ----
# The client sets gtag transport_url = /e2, so GA's collect calls already go to
# /e2/g/collect (below). We still proxy the script itself first-party.
location = /e2/s.js {
    proxy_pass https://www.googletagmanager.com/gtag/js$is_args$args;
    proxy_set_header Host www.googletagmanager.com;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    # Belt-and-braces: if any collect URL is hardcoded, send it first-party too.
    sub_filter "https://www.google-analytics.com" "/e2";
    sub_filter "https://region1.google-analytics.com" "/e2";
    proxy_hide_header Content-Security-Policy;
    add_header Cache-Control "public, max-age=3600";
    gzip on;
    gzip_types application/javascript;
}

# ---- GA4: the collect endpoint (region-agnostic via transport_url) ----
location ^~ /e2/g/collect {
    proxy_pass https://www.google-analytics.com/g/collect$is_args$args;
    proxy_set_header Host www.google-analytics.com;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# ---- GA4: any other google-analytics paths the script may hit ----
location ^~ /e2/ {
    proxy_pass https://www.google-analytics.com/;
    proxy_set_header Host www.google-analytics.com;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ============================================================================
# IMPORTANT: keep your existing X-Forwarded-For setup on the MAIN app location
# so /api/events and the server handlers see the real client IP:
#
#   location / {
#       proxy_pass http://127.0.0.1:3000;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Real-IP         $remote_addr;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# After editing:  sudo nginx -t  &&  sudo systemctl reload nginx
# ============================================================================
