# /etc/nginx/sites-available/elyle  — merged with first-party tracking proxy.
# Replace your existing file with this, then: sudo nginx -t && sudo systemctl reload nginx
#
# Requires the ngx_http_sub_module (standard on Ubuntu's `nginx` package). Verify:
#   nginx -V 2>&1 | tr ' ' '\n' | grep sub_module     # should print --with-http_sub_module

server {
    server_name elyle.enfinito.cloud;

    client_max_body_size 100M;

    # Serve uploads directly from disk
    location /uploads/ {
        alias /var/www/elyle/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # Next.js static files
    location /_next/static/ {
        proxy_cache_valid 200 60m;
        proxy_pass http://localhost:3011;
    }

    # ======================================================================
    # First-party tracking proxy (Meta pixel + GA4 gtag). Non-obvious paths
    # so ad blockers can't match the real hostnames. These match the defaults
    # in /admin/tracking → Configuration → "First-party proxy paths".
    # ======================================================================

    # --- Meta: pixel script (rewrite hardcoded hostnames -> first-party) ---
    location = /e1/s.js {
        proxy_set_header Accept-Encoding "";          # uncompressed so sub_filter can edit it
        rewrite ^ /en_US/fbevents.js break;
        proxy_pass https://connect.facebook.net;
        proxy_set_header Host connect.facebook.net;
        proxy_ssl_server_name on;

        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter "https://www.facebook.com/tr" "/e1/t";
        sub_filter "https://connect.facebook.net" "/e1";

        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- Meta: the event beacon (GET + POST, query string auto-preserved) ---
    location = /e1/t {
        rewrite ^ /tr break;
        proxy_pass https://www.facebook.com;
        proxy_set_header Host www.facebook.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Meta: config/signals fetches done by fbevents.js ---
    location ^~ /e1/ {
        rewrite ^/e1/(.*)$ /$1 break;
        proxy_pass https://connect.facebook.net;
        proxy_set_header Host connect.facebook.net;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
    }

    # --- GA4: gtag.js (transport_url already points collects at /e2) ---
    location = /e2/s.js {
        proxy_set_header Accept-Encoding "";
        rewrite ^ /gtag/js break;                     # ?id=G-XXX preserved automatically
        proxy_pass https://www.googletagmanager.com;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;

        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter "https://www.google-analytics.com" "/e2";
        sub_filter "https://region1.google-analytics.com" "/e2";

        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- GA4: the collect endpoint (longest-prefix wins over /e2/ below) ---
    location ^~ /e2/g/collect {
        rewrite ^ /g/collect break;
        proxy_pass https://www.google-analytics.com;
        proxy_set_header Host www.google-analytics.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- GA4: any other google-analytics paths gtag may hit ---
    location ^~ /e2/ {
        rewrite ^/e2/(.*)$ /$1 break;
        proxy_pass https://www.google-analytics.com;
        proxy_set_header Host www.google-analytics.com;
        proxy_ssl_server_name on;
    }

    # ======================================================================

    # Main app
    location / {
        proxy_pass http://localhost:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elyle.enfinito.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elyle.enfinito.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = elyle.enfinito.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name elyle.enfinito.cloud;
    listen 80;
    return 404; # managed by Certbot
}
