# nginx site for the Elysiam website at demo.elysium-lifestyle.bd (M36, D-581).
#
# Install once as /etc/nginx/sites-available/elysium-web-demo.conf, link it into
# sites-enabled, `sudo nginx -t && sudo systemctl reload nginx`, then
# `sudo certbot --nginx -d demo.elysium-lifestyle.bd` adds the 443 server and the
# redirect. docs/deploy-demo.md has the whole sequence.
#
# The website listens on 127.0.0.1:3601 (deploy/compose.demo.yml). It has no
# database and no admin panel: /admin is answered by the app itself with a
# redirect to the ERP, and products, orders and settings live in the ERP at
# erp.elysium-lifestyle.bd.

# Every shopper's /api call costs one call to the ERP, and the whole site shares
# one website key there (3,000 a minute by default): one client must not be able
# to spend it for everyone. Per visitor address (the real one, after the
# Cloudflare include), at the http level where a site file's top lines are read.
# Generous, because mobile carriers put many shoppers behind one address (CGNAT);
# the ERP's own per-shopper limits (D-534) are the fine-grained ones.
limit_req_zone $binary_remote_addr zone=elysium_web_demo_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=elysium_web_demo_auth:10m rate=60r/m;

upstream elysium_web_demo {
    server 127.0.0.1:3601;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.elysium-lifestyle.bd;

    # Behind Cloudflare: the visitor's address from CF-Connecting-IP, trusted only
    # from Cloudflare's ranges. The same file the brand ERPs use
    # (elysium-erp: infra/brand/nginx-cloudflare-realip.conf, installed by its
    # server-deploy.sh as /etc/nginx/snippets/erp-cloudflare-realip.conf).
    include /etc/nginx/snippets/erp-cloudflare-realip.conf;

    # Shopper forms and the SSLCommerz return are small; nothing is uploaded here.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app sets its own security headers (next.config.mjs) and a per-request
    # CSP with a nonce (middleware.js); nginx adds none, so nothing is doubled.

    # Content-hashed build files: cached for a year, never revalidated.
    location /_next/static/ {
        proxy_pass http://elysium_web_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Optimised product images (the ERP's /media/ files, resized by the app).
    location /_next/image {
        proxy_pass http://elysium_web_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # First-party tracking proxy paths (/e1/s.js, /e1/t, /e2/s.js, /e2/g/collect;
    # the ERP's default Website → Tracking → proxy paths). The website loads them
    # only while the ERP has the pixel or gtag on, so this can stay commented until
    # then: copy docs/nginx-tracking.conf to
    # /etc/nginx/snippets/elysium-tracking-proxy.conf, uncomment the include,
    # `sudo nginx -t && sudo systemctl reload nginx`, THEN switch the pixel on in
    # the ERP (docs/TRACKING.md).
    # include /etc/nginx/snippets/elysium-tracking-proxy.conf;

    # ncom.bd's connector calls (/api/ncom/*) belong to the ERP once its
    # connector exists (M35b, M37). Until then the website answers 404 for them.
    # location ^~ /api/ncom/ {
    #     proxy_pass https://erp.elysium-lifestyle.bd/ncom/;
    #     proxy_set_header Host erp.elysium-lifestyle.bd;
    #     proxy_ssl_server_name on;
    # }

    # Sign-in, sign-up, codes and resets: a slower bucket (the ERP also counts
    # them per shopper, D-534). Not next-auth's session reads, which every page
    # makes. Same headers as below.
    location ~ ^/api/auth/(register|verify-email|resend-otp|forgot-password|reset-password|change-password|callback/credentials)$ {
        limit_req zone=elysium_web_demo_auth burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://elysium_web_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The shop's own API (search, products, cart quote, checkout, events, …).
    # A plain prefix (not ^~), so the auth pattern above is still checked first.
    location /api/ {
        limit_req zone=elysium_web_demo_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://elysium_web_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Checkout retries the ERP within ~50 s (lib/erp.js); allow for it.
        proxy_read_timeout 60s;
    }

    # Everything else is the app. X-Real-IP and X-Forwarded-For are SET to the
    # visitor's address, never appended to: the app sends that address to the ERP
    # for its per-shopper limits (D-534) and believes these headers only because
    # it listens on 127.0.0.1, behind this file.
    location / {
        proxy_pass http://elysium_web_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
