<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Elysium Scanner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ── Login ──────────────────────────────────────────────────────────── -->
  <section id="screen-login" class="screen">
    <div class="login-wrap">
      <div class="brand">
        <img src="logo-dark.png" alt="Elysium Lifestyle" class="brand-logo" />
        <p class="muted">Warehouse scanner — sign in</p>
      </div>

      <label>Server address</label>
      <input id="in-server" type="url" inputmode="url" placeholder="https://your-domain.com" autocapitalize="off" autocorrect="off" spellcheck="false" />

      <!-- Primary: sign in via the website (supports Google + email/password). -->
      <button id="btn-web-login" type="button" class="btn btn-google btn-block">
        <span class="g-mark">G</span> Sign in with Google
      </button>
      <p class="muted small center hint">Opens your website login — use Google or email there.</p>
      <p id="login-error" class="error" hidden></p>

      <div class="divider"><span>or</span></div>

      <!-- Secondary: type email + password directly in the app. -->
      <button id="toggle-pw" type="button" class="linkish btn-block">Use email &amp; password instead</button>
      <form id="login-form" autocomplete="off" hidden>
        <label>Email</label>
        <input id="in-email" type="email" inputmode="email" placeholder="you@elysium.com" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <label>Password</label>
        <input id="in-password" type="password" placeholder="••••••••" />
        <button id="btn-login" type="submit" class="btn btn-outline btn-block">Sign in</button>
      </form>

      <!-- Fallback: paste the sign-in code if the app didn't bounce back. -->
      <button id="toggle-code" type="button" class="linkish btn-block subtle">Paste a sign-in code</button>
      <div id="paste-row" class="row" hidden>
        <input id="in-code" type="text" placeholder="Paste sign-in code" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button id="btn-code-go" type="button" class="btn btn-outline">Go</button>
      </div>
    </div>
  </section>

  <!-- ── Scan home ──────────────────────────────────────────────────────── -->
  <section id="screen-scan" class="screen" hidden>
    <header class="topbar">
      <div>
        <p class="muted small">Signed in as</p>
        <p id="who" class="who"></p>
      </div>
      <button id="btn-logout" class="btn btn-ghost btn-sm">Sign out</button>
    </header>

    <div class="scan-hero">
      <div class="scan-ring"><div class="scan-icon">▢</div></div>
      <button id="btn-scan" class="btn btn-primary btn-xl btn-block">Scan label</button>
      <p class="muted center">Point at the barcode on the shipping label.</p>
      <p id="scan-status" class="status" hidden></p>
    </div>

    <div class="manual">
      <p class="muted small">Or type the order / tracking number</p>
      <form id="manual-form" class="row">
        <input id="in-manual" type="text" placeholder="ELY-2026-00001" autocapitalize="characters" autocorrect="off" spellcheck="false" />
        <button type="submit" class="btn btn-outline">Find</button>
      </form>
    </div>
  </section>

  <!-- ── Result / packing list ──────────────────────────────────────────── -->
  <section id="screen-result" class="screen" hidden>
    <header class="topbar">
      <button id="btn-back" class="btn btn-ghost btn-sm">‹ Back</button>
      <span id="result-progress" class="progress-pill"></span>
    </header>
    <div id="result-body" class="result-body"></div>
    <div class="result-footer">
      <button id="btn-scan-next" class="btn btn-primary btn-xl btn-block">Scan next</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
